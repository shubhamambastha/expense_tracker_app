name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: no job here writes to the repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Must be a real version number ('stable' is not one). Pinned to
          # the release pubspec.lock was resolved with; bump both together.
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --no-pub

      - name: Build APK (example)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
        run: |
          flutter build apk \
            --dart-define=API_BASE_URL=${API_BASE_URL} \
            --dart-define=AUTH0_DOMAIN=${AUTH0_DOMAIN} \
            --dart-define=AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}

      - name: (Optional) Build iOS
        if: runner.os == 'macOS'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
        run: |
          flutter build ios \
            --no-codesign \
            --dart-define=API_BASE_URL=${API_BASE_URL} \
            --dart-define=AUTH0_DOMAIN=${AUTH0_DOMAIN} \
            --dart-define=AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}

      - name: Upload artifact (APK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/*.apk
